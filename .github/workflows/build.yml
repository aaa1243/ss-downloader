name: Build EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check script for syntax errors
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\SSDownloader-GUI.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; throw "Syntax errors found" }
          Write-Host "No syntax errors"

      - name: Install ps2exe
        shell: pwsh
        run: Install-Module ps2exe -Scope CurrentUser -Force

      - name: Build EXE
        shell: pwsh
        run: |
          Invoke-ps2exe -inputFile .\SSDownloader-GUI.ps1 `
            -outputFile .\SSDownloader.exe `
            -noConsole `
            -STA `
            -title "SS Tools Downloader" `
            -product "SS Tools Downloader" `
            -version "1.0.0"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SSDownloader
          path: SSDownloader.exe

      - name: Publish release (only on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SSDownloader.exe
